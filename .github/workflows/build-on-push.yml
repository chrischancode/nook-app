name: Build and Release Notchify

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build App
        run: |
          set -euo pipefail
          xcodebuild -scheme Nook -configuration Release \
            -derivedDataPath build \
            build

      - name: Package App (.zip and .dmg)
        run: |
          cd build/Build/Products/Release
          cp -R Nook.app Notchify.app
          # Create .zip archive
          ditto -c -k --sequesterRsrc --keepParent Notchify.app Notchify.zip
          # Create .dmg Apple Disk Image
          hdiutil create -volname "Notchify" -srcfolder Notchify.app -ov -format UDZO Notchify.dmg

      - name: Upload Notchify Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Notchify-App
          path: |
            build/Build/Products/Release/Notchify.zip
            build/Build/Products/Release/Notchify.dmg

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/Build/Products/Release
          gh release upload v1.0.0 Notchify.dmg Notchify.zip --clobber || \
          gh release create v1.0.0 Notchify.dmg Notchify.zip --title "Notchify v1.0.0" --notes "Notchify for macOS (v1.0.0)"
