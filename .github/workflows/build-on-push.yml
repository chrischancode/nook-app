name: Build Nook App

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Nook
        run: |
          set -euo pipefail
          xcodebuild -scheme Nook -configuration Release \
            -derivedDataPath build \
            build

      - name: Compress App
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Nook.app Nook.zip

      - name: Upload Nook.zip
        uses: actions/upload-artifact@v4
        with:
          name: Nook-App
          path: build/Build/Products/Release/Nook.zip
